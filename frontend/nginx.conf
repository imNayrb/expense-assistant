server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Le chiamate all'API vanno al container del backend: stessa origine, niente CORS.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Le risposte dell'assistente possono richiedere qualche secondo.
        proxy_read_timeout 90s;
    }

    # I file con hash nel nome non cambiano mai: cache lunga.
    location ~* \.(js|css|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Routing lato client: ogni percorso sconosciuto restituisce l'app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
