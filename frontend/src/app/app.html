<aside class="sidebar">
  <a class="brand" routerLink="/">
    <span class="logo" aria-hidden="true"><lucide-icon [img]="icons.Wallet" [size]="18" /></span>
    Spese
  </a>
  <button type="button" class="btn block add" (click)="ui.openSheet()">
    <lucide-icon [img]="icons.Plus" [size]="18" [strokeWidth]="2.6" /> Nuova spesa
  </button>
  <nav aria-label="Sezioni">
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
      >
        <lucide-icon [img]="link.icon" [size]="20" />
        {{ link.label }}
      </a>
    }
  </nav>
</aside>

<main>
  <router-outlet />
</main>

<nav class="tabbar" aria-label="Sezioni">
  @for (link of leftLinks; track link.path) {
    <a
      class="tab pressable"
      [routerLink]="link.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <lucide-icon [img]="link.icon" [size]="22" />
      <span>{{ link.label }}</span>
    </a>
  }
  <button type="button" class="fab pressable" (click)="ui.openSheet()" aria-label="Nuova spesa">
    <lucide-icon [img]="icons.Plus" [size]="26" [strokeWidth]="2.6" />
  </button>
  @for (link of rightLinks; track link.path) {
    <a
      class="tab pressable"
      [routerLink]="link.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <lucide-icon [img]="link.icon" [size]="22" />
      <span>{{ link.label }}</span>
    </a>
  }
</nav>

<app-add-sheet />
<app-toast-host />
