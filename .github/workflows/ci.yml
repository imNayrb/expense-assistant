name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Una sola esecuzione per branch: un nuovo push annulla quella in corso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21, Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build e test
        run: mvn -B -ntp verify

  mcp-server:
    name: Server MCP (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp-server/pyproject.toml
      - name: Installa le dipendenze
        run: pip install -e ".[dev]"
      - name: Lint e formattazione
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
