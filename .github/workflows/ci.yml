name: CI

on:
  pull_request:
  push:
    branches: [main]

# Permessi minimi: i job leggono il codice e basta. Un'azione compromessa non può
# scrivere nel repository.
permissions:
  contents: read

# Una sola esecuzione per branch: un nuovo push annulla quella in corso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21, Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # Il token non resta salvato nella copia locale del repository.
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build e test
        run: mvn -B -ntp verify

  mcp-server:
    name: Server MCP (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
        with:
          # Il token non resta salvato nella copia locale del repository.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp-server/pyproject.toml
      - name: Installa le dipendenze
        run: pip install -e ".[dev]"
      - name: Lint e formattazione
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          # Il token non resta salvato nella copia locale del repository.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # Node 24 include npm 11, la versione usata per il lockfile.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installa le dipendenze
        run: npm ci
      - name: Formattazione
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build di produzione
        run: npm run build

  # Avvia lo stack completo (PostgreSQL, backend, nginx) e lo usa come farebbe un utente.
  end-to-end:
    name: End-to-end (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, mcp-server, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          # Il token non resta salvato nella copia locale del repository.
          persist-credentials: false
      - name: Avvia lo stack
        run: docker compose up -d --build
      - name: Test delle API e del frontend
        run: ./scripts/smoke-test.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test del server MCP contro il backend reale
        working-directory: mcp-server
        env:
          EXPENSE_E2E_API_URL: http://localhost:8080
        run: |
          pip install -e ".[dev]"
          pytest -q tests/test_e2e.py
      - name: Log dei container in caso di errore
        if: failure()
        run: docker compose logs --no-color
      - name: Arresta lo stack
        if: always()
        run: docker compose down -v
