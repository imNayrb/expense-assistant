name: Sicurezza

# Analisi statica del codice con CodeQL, su ogni pull request, su main e ogni settimana.
# È gratuita per i repository pubblici; su un repository privato richiede GitHub Advanced
# Security, quindi il job viene saltato se il repository torna privato.
#
# La revisione delle dipendenze (actions/dependency-review-action) non è inclusa: richiede
# il "Dependency graph" attivo nelle impostazioni del repository. Una volta attivato, si può
# aggiungere un job dedicato.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # ogni lunedì, per trovare vulnerabilità scoperte di recente

permissions:
  contents: read

concurrency:
  group: sicurezza-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # Riporta gli avvisi CodeQL aperti come annotazioni e fallisce se ce ne sono di gravi.
  # Nelle pull request controlla il codice della PR, altrimenti il branch main.
  avvisi:
    name: Avvisi CodeQL aperti
    needs: codeql
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: read
    steps:
      - name: Controlla gli avvisi aperti
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || 'refs/heads/main' }}
        run: |
          alerts=$(gh api "repos/$REPO/code-scanning/alerts?state=open&ref=$REF&per_page=100")
          echo "$alerts" | jq -r '.[] | "::warning file=\(.most_recent_instance.location.path),line=\(.most_recent_instance.location.start_line)::[\(.rule.security_severity_level // .rule.severity)] \(.rule.id): \(.rule.description)"'
          totale=$(echo "$alerts" | jq 'length')
          gravi=$(echo "$alerts" | jq '[.[] | select(.rule.security_severity_level == "high" or .rule.security_severity_level == "critical" or .rule.severity == "error")] | length')
          echo "::notice::Avvisi CodeQL aperti su $REF: $totale, di cui gravi: $gravi"
          [ "$gravi" -eq 0 ]
