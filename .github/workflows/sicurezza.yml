name: Sicurezza

# Analisi statica del codice con CodeQL, su ogni pull request, su main e ogni settimana.
# È gratuita per i repository pubblici; su un repository privato richiede GitHub Advanced
# Security, quindi il job viene saltato se il repository torna privato.
#
# La revisione delle dipendenze (actions/dependency-review-action) non è inclusa: richiede
# il "Dependency graph" attivo nelle impostazioni del repository. Una volta attivato, si può
# aggiungere un job dedicato.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # ogni lunedì, per trovare vulnerabilità scoperte di recente

permissions:
  contents: read

concurrency:
  group: sicurezza-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
