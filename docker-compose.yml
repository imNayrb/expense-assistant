# Avvia tutta l'applicazione: PostgreSQL, backend e frontend.
#   cp .env.example .env    # e inserisci la tua ANTHROPIC_API_KEY
#   docker compose up --build
# Poi apri http://localhost:4200

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: expenses
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: ${DB_PASSWORD:-expenses}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenses -d expenses"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:-expenses}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
    depends_on:
      db:
        condition: service_healthy
    # Esposto anche sull'host, così il server MCP locale può usarlo.
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  db-data:
