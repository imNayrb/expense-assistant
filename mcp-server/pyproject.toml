[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "expense-mcp-server"
version = "0.3.0"
description = "Server MCP che espone le spese di Expense Assistant a Claude Desktop, Claude Code e altri client MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
expense-mcp-server = "expense_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
